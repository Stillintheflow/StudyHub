<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Manager — Quản Lý Tài Chính</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f8ef7'/><text x='16' y='23' font-size='20' text-anchor='middle' font-family='serif'>🐙</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a;
  --surface: #111827;
  --surface2: #1a2235;
  --border: #1e2d45;
  --accent: #4f8ef7;
  --accent2: #a78bfa;
  --green: #34d399;
  --red: #f87171;
  --gold: #fbbf24;
  --purple: #a78bfa;
  --text: #e2e8f0;
  --muted: #64748b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -30%;
  left: -20%;
  width: 60%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(79,142,247,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -20%;
  right: -10%;
  width: 50%;
  height: 50%;
  background: radial-gradient(ellipse, rgba(167,139,250,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.hub-btn {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 999;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  background: rgba(79,142,247,.1);
  border: 1px solid rgba(79,142,247,.25);
  border-radius: 8px;
  color: var(--accent);
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  transition: background .15s, border-color .15s;
}
.hub-btn:hover { background: rgba(79,142,247,.2); border-color: rgba(79,142,247,.45); }

.wrap {
  position: relative;
  z-index: 1;
  max-width: 1000px;
  margin: 0 auto;
  padding: 90px 24px 60px;
}

header.page-head {
  text-align: center;
  margin-bottom: 40px;
}
.logo {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
  opacity: 0.8;
}
h1.hero {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #e2e8f0 30%, var(--accent) 70%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub { color: var(--muted); font-size: 0.95rem; }

/* NET WORTH CARD */
.net-worth {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 32px;
  margin-bottom: 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.net-worth::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(79,142,247,0.08), transparent 60%);
}
.net-worth-label {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  position: relative;
}
.net-worth-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(1.8rem, 6vw, 3rem);
  font-weight: 700;
  color: var(--text);
  position: relative;
}
.net-worth-amount.negative { color: var(--red); }

/* allocation bar */
.alloc-bar {
  display: flex;
  height: 10px;
  border-radius: 100px;
  overflow: hidden;
  margin-top: 20px;
  background: var(--surface2);
  position: relative;
}
.alloc-seg { height: 100%; transition: width .3s ease; }

.alloc-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  margin-top: 14px;
  position: relative;
}
.alloc-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.alloc-dot { width: 8px; height: 8px; border-radius: 50%; }

/* SUMMARY CARDS */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 32px;
}
.summary-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  cursor: pointer;
  transition: border-color .2s, transform .15s;
  position: relative;
}
.summary-card:hover { transform: translateY(-2px); }
.summary-card.active { border-color: var(--card-color); }
.summary-card-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.summary-card-icon { font-size: 18px; }
.summary-card-title { font-size: 13px; font-weight: 600; color: var(--muted); }
.summary-card-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.summary-card-count { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* FORM */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}
.panel-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-row {
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr auto;
  gap: 10px;
}
@media (max-width: 640px) {
  .form-row { grid-template-columns: 1fr 1fr; }
}

.form-row-extra {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}

input, select {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 13px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color .15s;
  width: 100%;
}
input:focus, select:focus { border-color: var(--accent); }
input::placeholder { color: var(--muted); }

select { cursor: pointer; }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: 10px;
}
.btn-primary {
  background: var(--accent);
  color: #0a0e1a;
  font-weight: 700;
  font-size: 14px;
  padding: 11px 20px;
  white-space: nowrap;
  transition: opacity .15s;
}
.btn-primary:hover { opacity: 0.88; }

/* LIST */
.list-group { margin-bottom: 18px; }
.list-group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  margin: 22px 0 10px;
  padding-left: 2px;
}
.list-group-head .dot { width: 8px; height: 8px; border-radius: 50%; }

.item-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  transition: border-color .15s;
}
.item-row:hover { border-color: var(--accent); }
.item-icon {
  font-size: 20px;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 600; font-size: 14.5px; }
.item-note { font-size: 12px; color: var(--muted); margin-top: 2px; }

.item-edit-form {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.item-edit-row {
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 8px;
}
.item-edit-extra {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
@media (max-width: 640px) {
  .item-edit-row, .item-edit-extra { grid-template-columns: 1fr 1fr; }
}
.item-edit-form input, .item-edit-form select { font-size: 13px; padding: 9px 11px; }
.item-amount {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 15px;
  cursor: text;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid transparent;
  text-align: right;
  min-width: 110px;
}
.item-amount:hover, .item-amount:focus { border-color: var(--border); background: var(--surface2); outline: none; }
.item-amount-block {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.item-maturity {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
}
.item-maturity .arrow { margin: 0 4px; color: var(--muted); }
.item-maturity b { color: var(--green); font-weight: 700; }
.item-maturity.overdue { color: var(--gold); }
.item-maturity.overdue b { color: var(--gold); }
.item-actions { display: flex; gap: 6px; }
.icon-btn {
  background: transparent;
  color: var(--muted);
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface2); color: var(--text); }
.icon-btn.danger:hover { color: var(--red); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 14px;
}

/* ACTIVITY LOG */
.log-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12.5px;
  color: var(--muted);
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.log-item:last-child { border-bottom: none; }
.log-item .log-main { color: var(--text); }
.log-item .log-time { flex-shrink: 0; white-space: nowrap; }

.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.toolbar button {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 14px;
  transition: color .15s, border-color .15s;
}
.toolbar button:hover, .toolbar button.active { color: var(--text); border-color: var(--accent); }

footer.page-foot {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 40px;
}
</style>
</head>
<body>

<a class="hub-btn" href="index.html">← Hub</a>

<div class="wrap">

  <header class="page-head">
    <div class="logo">Finance Manager</div>
    <h1 class="hero">Quản Lý Tài Chính</h1>
    <p class="hero-sub">Theo dõi ngân hàng, tiết kiệm, tiền mặt và chứng khoán ở một nơi.</p>
  </header>

  <div class="net-worth">
    <div class="net-worth-label">Tổng tài sản ròng</div>
    <div class="net-worth-amount" id="netWorth">0 ₫</div>
    <div class="alloc-bar" id="allocBar"></div>
    <div class="alloc-legend" id="allocLegend"></div>
  </div>

  <div class="summary-grid" id="summaryGrid"></div>

  <div class="panel">
    <div class="panel-title">➕ Thêm khoản mục</div>
    <div class="form-row">
      <input type="text" id="inputName" placeholder="Tên (vd: Vietcombank, Tiết kiệm 6 tháng...)">
      <select id="inputType">
        <option value="bank">🏦 Ngân hàng</option>
        <option value="saving">💰 Tiết kiệm</option>
        <option value="cash">💵 Tiền mặt</option>
        <option value="stock">📈 Chứng khoán</option>
      </select>
      <input type="number" id="inputAmount" placeholder="Số tiền (VNĐ)" step="1000">
      <button class="btn-primary" id="btnAdd">Thêm</button>
    </div>
    <div class="form-row-extra" id="savingExtra" style="display:none;">
      <input type="number" id="inputRate" placeholder="Lãi suất (%/năm)" step="0.1">
      <input type="date" id="inputEndDate" title="Ngày đáo hạn">
    </div>
  </div>

  <div class="toolbar" id="filterBar">
    <button data-filter="all" class="active">Tất cả</button>
    <button data-filter="bank">🏦 Ngân hàng</button>
    <button data-filter="saving">💰 Tiết kiệm</button>
    <button data-filter="cash">💵 Tiền mặt</button>
    <button data-filter="stock">📈 Chứng khoán</button>
  </div>

  <div id="listContainer"></div>

  <div class="panel" id="logPanel" style="display:none;">
    <div class="panel-title">🕘 Hoạt động gần đây</div>
    <div id="logList"></div>
  </div>

  <div class="toolbar">
    <button id="btnExport">⭳ Xuất JSON</button>
    <button id="btnImport">⭱ Nhập JSON</button>
    <button id="btnClearLog">Xoá lịch sử</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none;">
  </div>

  <footer class="page-foot">Dữ liệu lưu cục bộ trong trình duyệt (localStorage) — không gửi đi bất kỳ đâu.</footer>

</div>

<script>
const STORAGE_KEY = 'finance_data';
const LOG_KEY = 'finance_log';

const TYPES = {
  bank:   { label: 'Ngân hàng',    icon: '🏦', color: '#4f8ef7' },
  saving: { label: 'Tiết kiệm',    icon: '💰', color: '#34d399' },
  cash:   { label: 'Tiền mặt',     icon: '💵', color: '#fbbf24' },
  stock:  { label: 'Chứng khoán',  icon: '📈', color: '#a78bfa' },
};

let items = [];
let log = [];
let activeFilter = 'all';
let editingId = null;

function loadData() {
  try { items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { items = []; }
  try { log = JSON.parse(localStorage.getItem(LOG_KEY)) || []; }
  catch { log = []; }
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
function saveLog() { localStorage.setItem(LOG_KEY, JSON.stringify(log)); }

function addLog(text) {
  log.unshift({ text, time: Date.now() });
  log = log.slice(0, 50);
  saveLog();
  renderLog();
}

function fmtMoney(n) {
  return new Intl.NumberFormat('vi-VN').format(Math.round(n)) + ' ₫';
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
}

function fmtDate(isoDate) {
  return new Date(isoDate + 'T00:00:00').toLocaleDateString('vi-VN');
}

function isOverdue(isoDate) {
  return new Date(isoDate + 'T00:00:00') < new Date(new Date().toDateString());
}

function savingDetails(it) {
  const parts = [];
  if (it.rate !== undefined && it.rate !== null && it.rate !== '') parts.push(`Lãi suất ${it.rate}%/năm`);
  return parts.join(' · ');
}

function maturityValue(it) {
  const rate = (it.rate !== undefined && it.rate !== null && it.rate !== '') ? it.rate : 0;
  const end = new Date(it.endDate + 'T00:00:00');
  const start = new Date(new Date().toDateString());
  const days = Math.max((end - start) / 86400000, 0);
  const years = days / 365;
  return it.amount * (1 + (rate / 100) * years);
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function totalsByType() {
  const totals = {};
  for (const key of Object.keys(TYPES)) totals[key] = { sum: 0, count: 0 };
  for (const it of items) {
    totals[it.type].sum += it.amount;
    totals[it.type].count += 1;
  }
  return totals;
}

function render() {
  const totals = totalsByType();
  const grandTotal = Object.values(totals).reduce((a, t) => a + t.sum, 0);

  const netWorthEl = document.getElementById('netWorth');
  netWorthEl.textContent = fmtMoney(grandTotal);
  netWorthEl.classList.toggle('negative', grandTotal < 0);

  // allocation bar (only positive contributions shown proportionally)
  const positiveSum = Object.entries(totals).reduce((a, [, t]) => a + Math.max(t.sum, 0), 0);
  const allocBar = document.getElementById('allocBar');
  const allocLegend = document.getElementById('allocLegend');
  allocBar.innerHTML = '';
  allocLegend.innerHTML = '';
  for (const [key, meta] of Object.entries(TYPES)) {
    const t = totals[key];
    const pct = positiveSum > 0 ? (Math.max(t.sum, 0) / positiveSum) * 100 : 0;
    if (pct > 0) {
      const seg = document.createElement('div');
      seg.className = 'alloc-seg';
      seg.style.width = pct + '%';
      seg.style.background = meta.color;
      allocBar.appendChild(seg);
    }
    const legendItem = document.createElement('div');
    legendItem.className = 'alloc-legend-item';
    legendItem.innerHTML = `<span class="alloc-dot" style="background:${meta.color}"></span>${meta.icon} ${meta.label} · ${pct.toFixed(0)}%`;
    allocLegend.appendChild(legendItem);
  }

  // summary cards
  const summaryGrid = document.getElementById('summaryGrid');
  summaryGrid.innerHTML = '';
  for (const [key, meta] of Object.entries(TYPES)) {
    const t = totals[key];
    const card = document.createElement('div');
    card.className = 'summary-card' + (activeFilter === key ? ' active' : '');
    card.style.setProperty('--card-color', meta.color);
    card.dataset.filter = key;
    card.innerHTML = `
      <div class="summary-card-top">
        <span class="summary-card-icon">${meta.icon}</span>
        <span class="summary-card-title">${meta.label}</span>
      </div>
      <div class="summary-card-amount">${fmtMoney(t.sum)}</div>
      <div class="summary-card-count">${t.count} khoản mục</div>
    `;
    card.addEventListener('click', () => setFilter(activeFilter === key ? 'all' : key));
    summaryGrid.appendChild(card);
  }

  renderList();
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('#filterBar button').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  render();
}

function renderList() {
  const container = document.getElementById('listContainer');
  container.innerHTML = '';

  const filtered = activeFilter === 'all' ? items : items.filter(it => it.type === activeFilter);

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state">Chưa có khoản mục nào. Thêm khoản đầu tiên ở trên ⬆</div>';
    return;
  }

  const groups = activeFilter === 'all'
    ? Object.keys(TYPES).map(key => [key, items.filter(it => it.type === key)]).filter(([, arr]) => arr.length)
    : [[activeFilter, filtered]];

  for (const [typeKey, arr] of groups) {
    const meta = TYPES[typeKey];
    const groupEl = document.createElement('div');
    groupEl.className = 'list-group';
    groupEl.innerHTML = `<div class="list-group-head"><span class="dot" style="background:${meta.color}"></span>${meta.icon} ${meta.label}</div>`;

    for (const it of arr) {
      const row = document.createElement('div');
      row.className = 'item-row';

      if (it.id === editingId) {
        const typeOptions = Object.entries(TYPES)
          .map(([key, m]) => `<option value="${key}" ${key === it.type ? 'selected' : ''}>${m.icon} ${m.label}</option>`)
          .join('');
        row.innerHTML = `
          <div class="item-icon" style="background:${meta.color}22;color:${meta.color}">${meta.icon}</div>
          <div class="item-edit-form">
            <div class="item-edit-row">
              <input type="text" class="edit-name" value="${escapeAttr(it.name)}" placeholder="Tên">
              <select class="edit-type">${typeOptions}</select>
              <input type="number" class="edit-amount" value="${it.amount}" step="1000" placeholder="Số tiền">
            </div>
            <div class="item-edit-extra" style="display:${it.type === 'saving' ? 'grid' : 'none'}">
              <input type="number" class="edit-rate" value="${it.rate ?? ''}" step="0.1" placeholder="Lãi suất (%/năm)">
              <input type="date" class="edit-enddate" value="${it.endDate ?? ''}" title="Ngày đáo hạn">
            </div>
          </div>
          <div class="item-actions">
            <button class="icon-btn" data-action="save-edit" data-id="${it.id}" title="Lưu">✓</button>
            <button class="icon-btn danger" data-action="cancel-edit" data-id="${it.id}" title="Huỷ">✕</button>
          </div>
        `;
      } else {
        const detail = it.type === 'saving' ? savingDetails(it) : '';
        const hasEndDate = it.type === 'saving' && it.endDate;
        const overdue = hasEndDate && isOverdue(it.endDate);
        const maturityHtml = hasEndDate ? `
          <div class="item-maturity${overdue ? ' overdue' : ''}">
            ${overdue ? 'Đã đáo hạn' : 'Đáo hạn'} ${fmtDate(it.endDate)}<span class="arrow">→</span><b>${fmtMoney(maturityValue(it))}</b>
          </div>` : '';
        row.innerHTML = `
          <div class="item-icon" style="background:${meta.color}22;color:${meta.color}">${meta.icon}</div>
          <div class="item-info">
            <div class="item-name">${escapeHtml(it.name)}</div>
            <div class="item-note">${detail ? detail + ' · ' : ''}Cập nhật ${fmtTime(it.updatedAt)}</div>
          </div>
          <div class="item-amount-block">
            <div class="item-amount" contenteditable="true" data-id="${it.id}" spellcheck="false">${fmtMoney(it.amount)}</div>
            ${maturityHtml}
          </div>
          <div class="item-actions">
            <button class="icon-btn" data-action="edit" data-id="${it.id}" title="Sửa">✏️</button>
            <button class="icon-btn danger" data-action="delete" data-id="${it.id}" title="Xoá">🗑</button>
          </div>
        `;
      }
      groupEl.appendChild(row);
    }
    container.appendChild(groupEl);
  }

  container.querySelectorAll('.item-amount').forEach(el => {
    el.addEventListener('blur', onAmountEdit);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  });
  container.querySelectorAll('[data-action="delete"]').forEach(el => {
    el.addEventListener('click', () => deleteItem(el.dataset.id));
  });
  container.querySelectorAll('[data-action="edit"]').forEach(el => {
    el.addEventListener('click', () => { editingId = el.dataset.id; renderList(); });
  });
  container.querySelectorAll('[data-action="cancel-edit"]').forEach(el => {
    el.addEventListener('click', () => { editingId = null; renderList(); });
  });
  container.querySelectorAll('[data-action="save-edit"]').forEach(el => {
    el.addEventListener('click', () => saveEdit(el.dataset.id, el.closest('.item-row')));
  });
  container.querySelectorAll('.item-edit-row .edit-type').forEach(el => {
    el.addEventListener('change', () => {
      const extra = el.closest('.item-edit-form').querySelector('.item-edit-extra');
      extra.style.display = el.value === 'saving' ? 'grid' : 'none';
    });
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function onAmountEdit(e) {
  const el = e.target;
  const id = el.dataset.id;
  const raw = el.textContent.replace(/[^\d-]/g, '');
  const value = parseFloat(raw);
  const it = items.find(i => i.id === id);
  if (!it) return;
  if (isNaN(value)) { el.textContent = fmtMoney(it.amount); return; }
  if (value !== it.amount) {
    const old = it.amount;
    it.amount = value;
    it.updatedAt = Date.now();
    saveData();
    addLog(`Cập nhật <b>${escapeHtml(it.name)}</b>: ${fmtMoney(old)} → ${fmtMoney(value)}`);
  }
  render();
}

function saveEdit(id, rowEl) {
  const it = items.find(i => i.id === id);
  if (!it) return;

  const name = rowEl.querySelector('.edit-name').value.trim();
  const type = rowEl.querySelector('.edit-type').value;
  const amount = parseFloat(rowEl.querySelector('.edit-amount').value);
  const rateRaw = rowEl.querySelector('.edit-rate').value;
  const endDateRaw = rowEl.querySelector('.edit-enddate').value;

  if (!name || isNaN(amount)) return;

  const oldAmount = it.amount;
  it.name = name;
  it.type = type;
  it.amount = amount;
  if (type === 'saving') {
    it.rate = rateRaw !== '' ? parseFloat(rateRaw) : undefined;
    it.endDate = endDateRaw || undefined;
  } else {
    delete it.rate;
    delete it.endDate;
  }
  it.updatedAt = Date.now();

  editingId = null;
  saveData();
  addLog(`Sửa <b>${escapeHtml(name)}</b>: ${fmtMoney(oldAmount)} → ${fmtMoney(amount)}`);
  render();
}

function deleteItem(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  if (!confirm(`Xoá "${it.name}"?`)) return;
  items = items.filter(i => i.id !== id);
  saveData();
  addLog(`Xoá <b>${escapeHtml(it.name)}</b> (${fmtMoney(it.amount)})`);
  render();
}

function addItem() {
  const nameEl = document.getElementById('inputName');
  const typeEl = document.getElementById('inputType');
  const amountEl = document.getElementById('inputAmount');
  const rateEl = document.getElementById('inputRate');
  const endDateEl = document.getElementById('inputEndDate');

  const name = nameEl.value.trim();
  const type = typeEl.value;
  const amount = parseFloat(amountEl.value);

  if (!name) { nameEl.focus(); return; }
  if (isNaN(amount)) { amountEl.focus(); return; }

  const it = { id: uid(), name, type, amount, updatedAt: Date.now() };
  if (type === 'saving') {
    if (rateEl.value !== '') it.rate = parseFloat(rateEl.value);
    if (endDateEl.value) it.endDate = endDateEl.value;
  }
  items.push(it);
  saveData();
  const detail = type === 'saving' ? savingDetails(it) : '';
  addLog(`Thêm <b>${escapeHtml(name)}</b> (${TYPES[type].label}): ${fmtMoney(amount)}${detail ? ' · ' + detail : ''}`);

  nameEl.value = '';
  amountEl.value = '';
  rateEl.value = '';
  endDateEl.value = '';
  nameEl.focus();
  render();
}

function renderLog() {
  const logPanel = document.getElementById('logPanel');
  const logList = document.getElementById('logList');
  if (log.length === 0) { logPanel.style.display = 'none'; return; }
  logPanel.style.display = '';
  logList.innerHTML = log.map(l => `
    <div class="log-item">
      <span class="log-main">${l.text}</span>
      <span class="log-time">${fmtTime(l.time)}</span>
    </div>
  `).join('');
}

function exportData() {
  const blob = new Blob([JSON.stringify({ items, log }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finance-data-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data.items)) {
        items = data.items;
        log = Array.isArray(data.log) ? data.log : log;
        saveData();
        saveLog();
        addLog('Nhập dữ liệu từ file JSON');
        render();
        renderLog();
      } else {
        alert('File không hợp lệ.');
      }
    } catch {
      alert('Không đọc được file JSON.');
    }
  };
  reader.readAsText(file);
}

function init() {
  loadData();
  render();
  renderLog();

  document.getElementById('btnAdd').addEventListener('click', addItem);
  [document.getElementById('inputName'), document.getElementById('inputAmount')].forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  });

  document.getElementById('inputType').addEventListener('change', e => {
    document.getElementById('savingExtra').style.display = e.target.value === 'saving' ? 'grid' : 'none';
  });

  document.getElementById('filterBar').addEventListener('click', e => {
    const btn = e.target.closest('button[data-filter]');
    if (btn) setFilter(btn.dataset.filter);
  });

  document.getElementById('btnExport').addEventListener('click', exportData);
  document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
  document.getElementById('fileImport').addEventListener('change', e => {
    if (e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('btnClearLog').addEventListener('click', () => {
    if (!confirm('Xoá toàn bộ lịch sử hoạt động?')) return;
    log = [];
    saveLog();
    renderLog();
  });
}

init();
</script>

</body>
</html>
